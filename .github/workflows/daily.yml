name: Daily scrape

on:
  # The daily run is started at 04:15 UTC by an external cron service calling
  # the GitHub API (workflow_dispatch): bennet.com/robots.txt asks for visits
  # between 04:00 and 08:45 UTC, and GitHub starts scheduled runs hours late.
  # This schedule is only a fallback: it does nothing if a run already
  # succeeded today.
  schedule:
    - cron: "15 4 * * *"
  # Manual and external runs: empty inputs fall back to the repository variables
  # DETAILS_MINUTES and DELAY, then to the defaults below.
  workflow_dispatch:
    inputs:
      details_minutes:
        description: "Time budget for product pages, minutes (empty: DETAILS_MINUTES or 180)"
        default: ""
      delay:
        description: "Seconds between requests (empty: DELAY or 10)"
        default: ""

concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 280
    steps:
      - name: Skip if today's scrape already succeeded
        id: guard
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          done=$(gh run list -R "$GITHUB_REPOSITORY" -w daily.yml -s success \
            --created ">=$(date -u +%F)" --json databaseId -q length)
          echo "done=$([ "$done" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          [ "$done" -gt 0 ] && echo "::notice::Today's scrape already ran, nothing to do" || true
      - if: steps.guard.outputs.done != 'true'
        uses: actions/checkout@v4
      - if: steps.guard.outputs.done != 'true'
        uses: astral-sh/setup-uv@v6
      - if: steps.guard.outputs.done != 'true'
        run: uv sync --frozen
      - name: Scrape
        if: steps.guard.outputs.done != 'true'
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          DETAILS_MINUTES: ${{ inputs.details_minutes || vars.DETAILS_MINUTES || '180' }}
          DELAY: ${{ inputs.delay || vars.DELAY || '10' }}
        run: |
          uv run python main.py --delay "$DELAY" daily \
            --details-limit 100000 --details-minutes "$DETAILS_MINUTES"
